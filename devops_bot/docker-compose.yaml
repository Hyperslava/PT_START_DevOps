services:
  bot:
    image: "bot_image"
    depends_on:
      - db
    environment:
      - TOKEN=$(TOKEN)
      - RM_HOST=$(RM_HOST)
      - RM_PORT=$(RM_PORT)
      - RM_USER=$(RM_USER)
      - RM_PASSWORD=$(RM_PASSWORD)
      - DB_HOST=$(DB_HOST)
      - DB_PORT=$(DB_PORT)
      - DB_DATABASE=$(DB_DATABASE)
      - DB_USER=$(DB_USER)
      - DB_PASSWORD=$(DB_PASSWORD)
    networks:
      - bot_network
    volumes:
      - ./logfile.txt:/app/logfile.txt
      - ./.my_env:/app/.env
    restart: unless-stopped

  db:
    image: "db_image"
    user: postgres
    environment:
      - POSTGRES_DB=$(DB_DATABASE)
      - POSTGRES_USER=$(DB_USER)
      - POSTGRES_PASSWORD=$(DB_PASSWORD)
      - POSTGRES_SSL=on
      - POSTGRES_SSL_CERT_FILE=/etc/ssl/certs/ssl-cert-snakeoil.pem
      - POSTGRES_SSL_KEY_FILE=/etc/ssl/private/ssl-cert-snakeoil.key
      - POSTGRES_HOST_AUTH_METHOD="scram-sha-256"
    command: |
      postgres
      -c archive_mode=on
      -c archive_command='cp %p /oracle/pg_data/archive/%f'
      -c max_wal_senders=10
      -c wal_level=replica
      -c wal_log_hints=on
      -c log_replication_commands=on
      -c hot_standby=on
      -c max_replication_slots=10
      -c hot_standby_feedback=on
      -c ssl=on
      -c ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem
      -c ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
      -c listen_addresses='*'
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5442:5432"
    restart: unless-stopped

  db_repl:
    image: "db_repl_image"
    depends_on:
      - db
    environment:
      - PGUSER=$(DB_REPL_USER)
      - PGPASSWORD=$(DB_REPL_PASSWORD)
    command: |
      bash -c "
      until pg_basebackup --pgdata=/var/lib/postgresql/data -R --slot=replication_slot --host=192.168.1.129 --port=5442
      do
      echo 'Waiting for primary to connect...'
      sleep 1s
      done
      echo 'Backup done, starting replica...'
      chmod 0700 /var/lib/postgresql/data
      postgres
      "
    volumes:
      - db_repl_data:/var/lib/postgresql/data
    ports:
      - "5443:5432"
    restart: unless-stopped

networks:
  bot_network:
    
volumes:
  db_data:
  db_repl_data:
